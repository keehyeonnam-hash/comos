<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14131a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>이야기관 — AI 사용자 참여형 웹소설</title>
<style>
:root{
  color-scheme: dark;
  --bg:#14131a; --ink:#ece8f0; --accent:#c9a86a; --accent2:#b06a8a;
  --panel:#1e1c26; --panel2:#262430; --border:#3a3648; --muted:#9a93a8;
  --chipbg:#2a2738; --chipborder:#443f56;
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body{
  font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
  transition:background .4s ease,color .4s ease;
}
.wrap{ max-width:760px; margin:0 auto; padding:14px; }

.title-bar{ display:flex; align-items:center; justify-content:space-between; border-bottom:2px solid var(--accent); padding-bottom:10px; margin-bottom:12px; gap:8px; }
.title-bar h1{ font-size:18px; letter-spacing:2px; color:var(--accent); }
.title-bar .sub{ font-size:11px; color:var(--muted); letter-spacing:1px; }
.tbtns{ display:flex; gap:6px; }
.btn-ghost{ background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:6px; padding:7px 10px; font-size:12px; cursor:pointer; font-family:inherit; }
.btn-ghost:active{ background:var(--panel2); }

.panel{ background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:0 6px 18px rgba(0,0,0,.25); }

#statsPanel{ padding:13px 15px; margin-bottom:12px; }
.stats-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.char-name{ font-size:16px; font-weight:700; color:var(--accent); }
.char-meta{ font-size:11px; color:var(--muted); text-align:right; }
.bars{ display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
.bar-row{ display:flex; flex-direction:column; gap:3px; }
.bar-label{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink); opacity:.85; }
.bar-track{ height:9px; background:var(--panel2); border-radius:6px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:6px; transition:width .5s ease; }
.aff-row{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
.aff-name{ font-weight:700; color:var(--accent2); }
.inv{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); }
.inv-title{ font-size:12px; color:var(--muted); margin-bottom:6px; letter-spacing:1px; }
.inv-items{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ background:var(--chipbg); border:1px solid var(--chipborder); color:var(--ink); padding:3px 9px; border-radius:14px; font-size:12px; }
.chip.empty{ color:var(--muted); border-style:dashed; }

#storyPanel{ padding:16px 18px; margin-bottom:12px; min-height:180px; }
.story-scene{ font-size:16px; line-height:1.9; white-space:pre-wrap; }
.story-scene .you{ color:var(--accent); font-style:italic; display:block; margin:14px 0 4px; padding-left:10px; border-left:3px solid var(--accent); }
.toast{ font-size:12px; color:var(--accent2); margin-top:10px; }
.toast span{ display:inline-block; background:var(--chipbg); border:1px solid var(--chipborder); border-radius:12px; padding:2px 8px; margin:2px 4px 2px 0; }

#actionPanel{ padding:13px 15px; }
.choices{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
.choice{ text-align:left; background:var(--panel2); border:1px solid var(--border); color:var(--ink); padding:13px 14px; border-radius:8px; cursor:pointer; font-size:15px; font-family:inherit; transition:.12s; }
.choice:active{ background:var(--chipbg); }
.choice:disabled{ opacity:.5; }
.input-row{ display:flex; gap:8px; }
.input-row input{ flex:1; padding:13px 14px; border:1px solid var(--border); border-radius:8px; background:var(--panel2); font-size:15px; font-family:inherit; color:var(--ink); }
.input-row input:focus{ outline:none; border-color:var(--accent); }
.btn-send{ background:var(--accent); color:var(--bg); border:none; border-radius:8px; padding:0 18px; font-size:15px; cursor:pointer; font-family:inherit; font-weight:700; }
.btn-send:active{ opacity:.85; }
.btn-send:disabled{ opacity:.5; }

#setup, #config, #select{ padding:24px 20px; }
#setup, #config{ text-align:center; }
#setup h2, #config h2{ font-size:24px; color:var(--accent); letter-spacing:4px; margin-bottom:6px; }
#setup .tag, #config .tag, #select .tag{ color:var(--muted); font-size:13px; margin-bottom:20px; }
.brand{ text-align:center; margin-bottom:18px; }
.brand h2{ font-size:26px; color:var(--accent); letter-spacing:6px; }
.brand .tag{ margin-bottom:0; }
.field{ text-align:left; max-width:480px; margin:0 auto 16px; }
.field label{ display:block; font-size:13px; color:var(--muted); margin-bottom:6px; letter-spacing:1px; }
.field input, .field select{ width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:8px; background:var(--panel2); font-size:15px; font-family:inherit; color:var(--ink); }
.field .hint{ font-size:11px; color:var(--muted); margin-top:6px; line-height:1.5; }
.field .hint a{ color:var(--accent); }
.opt-row{ display:flex; gap:8px; flex-wrap:wrap; }
.opt{ flex:1; min-width:120px; background:var(--panel2); border:1px solid var(--border); color:var(--ink); padding:10px; border-radius:8px; cursor:pointer; font-size:13px; font-family:inherit; transition:.12s; text-align:left; }
.opt.sel{ background:var(--accent); color:var(--bg); border-color:var(--accent); }
.opt small{ display:block; color:var(--muted); font-size:11px; margin-top:3px; }
.opt.sel small{ color:var(--bg); opacity:.8; }
.btn-start{ margin-top:10px; background:var(--accent2); color:#fff; border:none; border-radius:10px; padding:14px 40px; font-size:16px; letter-spacing:3px; cursor:pointer; font-family:inherit; }
.btn-start:active{ opacity:.85; }
.btn-start:disabled{ opacity:.5; }

/* world gallery */
.worlds{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.world-card{ position:relative; text-align:left; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; cursor:pointer; transition:.15s; overflow:hidden; }
.world-card:hover{ transform:translateY(-2px); border-color:var(--accent); }
.world-card:active{ transform:translateY(0); }
.world-card .emoji{ font-size:30px; line-height:1; }
.world-card .wc-name{ font-size:17px; font-weight:700; color:var(--accent); margin-top:8px; letter-spacing:1px; }
.world-card .wc-genre{ display:inline-block; font-size:10px; color:var(--bg); background:var(--accent2); padding:2px 8px; border-radius:10px; margin-top:6px; letter-spacing:1px; }
.world-card .wc-tag{ font-size:12px; color:var(--muted); line-height:1.5; margin-top:8px; }
.continue-card{ grid-column:1/-1; background:var(--panel2); border:1px solid var(--accent); }
.continue-card .wc-name{ color:var(--accent); }
.continue-actions{ display:flex; gap:8px; margin-top:10px; }

.loading{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; padding:6px 2px; }
.dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); animation:bounce 1s infinite; }
.dot:nth-child(2){ animation-delay:.15s; } .dot:nth-child(3){ animation-delay:.3s; }
@keyframes bounce{ 0%,80%,100%{transform:translateY(0);opacity:.5} 40%{transform:translateY(-6px);opacity:1} }
.hidden{ display:none !important; }
.err{ color:#e07070; font-size:13px; padding:8px 2px; line-height:1.5; }
@media (max-width:540px){ .bars{grid-template-columns:1fr;} .worlds{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap">

  <!-- CONFIG: API 키 설정 -->
  <div id="config" class="panel">
    <h2>이야기관</h2>
    <div class="tag">먼저 한 번만 — AI 연결을 설정해 주세요</div>

    <div class="field">
      <label>Gemini API 키</label>
      <input id="cfgKey" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza... 형태의 키를 붙여넣으세요">
      <div class="hint">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio</a>에서 무료로 발급할 수 있어요(로그인 후 'Create API key'). 키는 이 기기의 브라우저에만 저장되며, 게임 진행 시 Google 서버로만 직접 전달됩니다.
      </div>
    </div>

    <div class="field">
      <label>모델</label>
      <select id="cfgModel">
        <option value="gemini-2.5-flash">Flash — 무료·빠름 (추천)</option>
        <option value="gemini-flash-latest">Flash(latest) — 무료 대안</option>
        <option value="gemini-2.5-pro">Pro — 고품질 (유료/제한적)</option>
        <option value="__custom__">직접 입력…</option>
      </select>
      <input id="cfgModelCustom" class="hidden" type="text" style="margin-top:8px;" placeholder="모델 이름 직접 입력 (예: gemini-3-flash)">
      <div class="hint">무료로 즐기려면 Flash를 추천해요. 모델 이름이 바뀌어 오류가 나면 '직접 입력'으로 바꿔 보세요.</div>
    </div>

    <button id="btnSaveCfg" class="btn-start">저 장</button>
    <div id="cfgErr" class="err hidden"></div>
  </div>

  <!-- WORLD SELECT -->
  <div id="select" class="panel hidden">
    <div class="brand">
      <h2>이야기관</h2>
      <div class="tag">AI가 매번 새로 써내려가는, 당신이 주인공인 웹소설</div>
    </div>
    <div class="worlds" id="worldGrid"></div>
    <div style="text-align:center;margin-top:18px;"><button id="btnEditCfg" class="btn-ghost">AI 연결 설정 변경</button></div>
  </div>

  <!-- SETUP -->
  <div id="setup" class="panel hidden">
    <h2 id="setupTitle">—</h2>
    <div class="tag" id="setupTag">—</div>

    <div class="field">
      <label>당신의 이름</label>
      <input id="inName" placeholder="주인공의 이름을 지어 주세요" maxlength="14">
    </div>
    <div class="field">
      <label>성별</label>
      <div class="opt-row" id="genderOpts">
        <button class="opt sel" data-g="남">남</button>
        <button class="opt" data-g="여">여</button>
        <button class="opt" data-g="무관">밝히지 않음</button>
      </div>
    </div>
    <div class="field">
      <label>출신 — 시작 배경을 고르세요</label>
      <div class="opt-row" id="originOpts"></div>
    </div>
    <button id="btnStart" class="btn-start">이야기 시작</button>
    <div style="margin-top:14px;"><button id="btnBackSelect" class="btn-ghost">← 다른 이야기 고르기</button></div>
    <div id="setupErr" class="err hidden"></div>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden">
    <div class="title-bar">
      <div>
        <h1 id="gameTitle">—</h1>
        <div class="sub">제 <span id="turnNo">1</span> 막</div>
      </div>
      <div class="tbtns">
        <button id="btnCfg2" class="btn-ghost">⚙</button>
        <button id="btnReset" class="btn-ghost">처음부터</button>
      </div>
    </div>

    <div id="statsPanel" class="panel">
      <div class="stats-head">
        <div class="char-name" id="dispName">—</div>
        <div class="char-meta" id="dispMeta">—</div>
      </div>
      <div class="bars" id="bars"></div>
      <div class="aff-row hidden" id="affRow">
        <div class="bar-label"><span><span id="affLabel">연심</span> · <span class="aff-name" id="affName"></span></span><span id="vAff">0</span></div>
        <div class="bar-track"><div class="bar-fill" id="bAff" style="width:0%;background:linear-gradient(90deg,#c43a5a,#f07f9a)"></div></div>
      </div>
      <div class="inv">
        <div class="inv-title">소지품</div>
        <div class="inv-items" id="invItems"><span class="chip empty">비어 있음</span></div>
      </div>
    </div>

    <div id="storyPanel" class="panel">
      <div class="story-scene" id="scene"></div>
      <div class="toast" id="toast"></div>
    </div>

    <div id="actionPanel" class="panel">
      <div id="loading" class="loading hidden"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span>이야기를 엮는 중…</span></div>
      <div class="choices" id="choices"></div>
      <div class="input-row">
        <input id="freeInput" placeholder="직접 행동을 입력…" maxlength="200">
        <button id="btnSend" class="btn-send">행동</button>
      </div>
      <div id="gameErr" class="err hidden"></div>
    </div>
  </div>

</div>

  function findWorld(id){ for(var i=0;i<WORLDS.length;i++){ if(WORLDS[i].id===id) return WORLDS[i]; } return WORLDS[0]; }

  var WORLD = WORLDS[0];

  var S = {
    world:"", name:"", gender:"남", origin:"",
    stats:{}, affName:"", aff:0, inv:[], turn:1,
    phase:"발단", ended:false,
    memory:"", lastScene:"", lastChoices:[], history:[]
  };

  function $(id){ return document.getElementById(id); }
  function show(el){ el.classList.remove("hidden"); }
  function hide(el){ el.classList.add("hidden"); }

  // ---------- theme ----------
  function applyTheme(t){
    var r=document.documentElement.style;
    r.setProperty("--bg",t.bg); r.setProperty("--ink",t.ink);
    r.setProperty("--accent",t.accent); r.setProperty("--accent2",t.accent2);
    r.setProperty("--panel",t.panel); r.setProperty("--panel2",t.panel2);
    r.setProperty("--border",t.border); r.setProperty("--muted",t.muted);
    r.setProperty("--chipbg",t.chipbg); r.setProperty("--chipborder",t.chipborder);
    document.documentElement.style.colorScheme=t.scheme;
    var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",t.bg);
  }

  // ---------- persistence ----------
  function loadCfg(){ try{ var r=localStorage.getItem(CFG_KEY); if(r){ var o=JSON.parse(r); CFG.key=o.key||""; CFG.model=o.model||"gemini-2.5-flash"; } }catch(e){} }
  function saveCfg(){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); }catch(e){} }

  function saveGame(){
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify({
      world:S.world, name:S.name, gender:S.gender, origin:S.origin,
      stats:S.stats, affName:S.affName, aff:S.aff, inv:S.inv, turn:S.turn,
      phase:S.phase, ended:S.ended,
      memory:S.memory, lastScene:S.lastScene, lastChoices:S.lastChoices,
      history:S.history.slice(-6)
    })); }catch(e){}
  }
  function loadSave(){ try{ var r=localStorage.getItem(SAVE_KEY); return r? JSON.parse(r):null; }catch(e){ return null; } }
  function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }

  // ---------- config screen ----------
  $("cfgModel").addEventListener("change", function(){
    $("cfgModelCustom").classList.toggle("hidden", this.value!=="__custom__");
  });
  function openConfig(){
    $("cfgKey").value = CFG.key;
    var sel=$("cfgModel"); var found=false;
    for(var i=0;i<sel.options.length;i++){ if(sel.options[i].value===CFG.model){ sel.value=CFG.model; found=true; break; } }
    if(!found && CFG.model){ sel.value="__custom__"; $("cfgModelCustom").classList.remove("hidden"); $("cfgModelCustom").value=CFG.model; }
    hide($("setup")); hide($("game")); hide($("select")); show($("config"));
    applyTheme(DEFAULT_THEME);
  }
  $("btnSaveCfg").addEventListener("click", function(){
    var k=$("cfgKey").value.trim();
    if(!k){ var e=$("cfgErr"); e.textContent="API 키를 입력해 주세요. (Google AI Studio에서 무료 발급)"; show(e); return; }
    var m=$("cfgModel").value;
    if(m==="__custom__"){ m=$("cfgModelCustom").value.trim()||"gemini-2.5-flash"; }
    CFG.key=k; CFG.model=m; saveCfg(); hide($("cfgErr"));
    hide($("config"));
    enterSelect();
  });
  $("btnEditCfg").addEventListener("click", openConfig);
  $("btnCfg2").addEventListener("click", openConfig);

  // ---------- world select ----------
  function enterSelect(){
    applyTheme(DEFAULT_THEME);
    hide($("config")); hide($("setup")); hide($("game")); show($("select"));
    var grid=$("worldGrid"); grid.innerHTML="";

    var sv=loadSave();
    if(sv && sv.name){
      var w=findWorld(sv.world);
      var cc=document.createElement("div"); cc.className="world-card continue-card";
      cc.innerHTML='<div class="emoji">'+w.emoji+'</div>'+
        '<div class="wc-name">이어하기 · '+escapeHtml(sv.name)+'</div>'+
        '<div class="wc-tag">'+escapeHtml(w.name)+' · '+escapeHtml(sv.origin||"")+' · '+(sv.ended?"완결":(sv.phase||"진행")+" "+(sv.turn||1)+"/"+TARGET_TURNS)+'</div>'+
        '<div class="continue-actions"><button class="btn-send" id="btnContinue" style="padding:9px 16px;">이어하기</button><button class="btn-ghost" id="btnDiscard">삭제</button></div>';
      grid.appendChild(cc);
      $("btnContinue").addEventListener("click", function(ev){ ev.stopPropagation(); var s=loadSave(); if(s) resumeGame(s); });
      $("btnDiscard").addEventListener("click", function(ev){ ev.stopPropagation(); if(confirm("저장된 이야기를 삭제할까요?")){ clearSave(); enterSelect(); } });
    }

    WORLDS.forEach(function(w){
      var card=document.createElement("div"); card.className="world-card";
      card.innerHTML='<div class="emoji">'+w.emoji+'</div>'+
        '<div class="wc-name">'+escapeHtml(w.name)+'</div>'+
        '<div class="wc-genre">'+escapeHtml(w.genre)+'</div>'+
        '<div class="wc-tag">'+escapeHtml(w.tagline)+'</div>';
      card.addEventListener("click", function(){ chooseWorld(w.id); });
      grid.appendChild(card);
    });
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  // ---------- setup ----------
  var gender="남", origin="";
  function bindOpts(containerId, attr, cb){
    var c=$(containerId);
    c.querySelectorAll(".opt").forEach(function(b){
      b.addEventListener("click", function(){
        c.querySelectorAll(".opt").forEach(function(x){x.classList.remove("sel");});
        b.classList.add("sel"); cb(b.getAttribute(attr));
      });
    });
  }
  bindOpts("genderOpts","data-g",function(v){gender=v;});

  function chooseWorld(id){
    WORLD=findWorld(id); applyTheme(WORLD.theme);
    hide($("select")); hide($("config")); hide($("game")); show($("setup"));
    $("setupTitle").textContent=WORLD.name;
    $("setupTag").textContent=WORLD.genre+" · "+WORLD.tagline;
    $("inName").value=""; gender="남";
    $("genderOpts").querySelectorAll(".opt").forEach(function(x){ x.classList.toggle("sel", x.getAttribute("data-g")==="남"); });
    // build origins
    var oc=$("originOpts"); oc.innerHTML="";
    WORLD.origins.forEach(function(o,idx){
      var b=document.createElement("button"); b.className="opt"+(idx===0?" sel":""); b.setAttribute("data-o",o.key);
      b.innerHTML=escapeHtml(o.label)+"<small>"+escapeHtml(o.desc)+"</small>";
      oc.appendChild(b);
    });
    origin=WORLD.origins[0].key;
    bindOpts("originOpts","data-o",function(v){origin=v;});
    hide($("setupErr"));
  }

  $("btnBackSelect").addEventListener("click", enterSelect);

  $("btnStart").addEventListener("click", function(){
    var nm=$("inName").value.trim();
    if(!nm){ var e=$("setupErr"); e.textContent="이름을 입력해 주세요."; show(e); return; }
    S.world=WORLD.id; S.name=nm; S.gender=gender; S.origin=origin;
    S.stats={}; var o=originMods(origin);
    WORLD.stats.forEach(function(s){ S.stats[s.key]=clamp(s.init+(o[s.key]||0)); });
    S.affName=""; S.aff=0; S.inv=[]; S.turn=1; S.phase="발단"; S.ended=false;
    S.memory=""; S.lastScene=""; S.lastChoices=[]; S.history=[];
    hide($("setup")); show($("game"));
    initGameChrome();
    renderStats(); startStory();
  });
  $("btnReset").addEventListener("click", function(){
    if(confirm("정말 처음부터 다시 시작할까요? 저장된 이야기가 삭제됩니다.")){ clearSave(); location.reload(); }
  });
  function originMods(key){ for(var i=0;i<WORLD.origins.length;i++){ if(WORLD.origins[i].key===key) return WORLD.origins[i].mods||{}; } return {}; }

  function initGameChrome(){
    $("gameTitle").textContent=WORLD.name;
    $("affLabel").textContent=WORLD.affLabel||"연심";
    $("freeInput").placeholder="직접 행동을 입력… 예: 주변을 살핀다";
    $("freeInput").disabled=false; $("btnSend").disabled=false;
  }

  // ---------- rendering ----------
  function clamp(n){ n=Math.round(n); return n<0?0:(n>100?100:n); }
  function renderStats(){
    $("dispName").textContent=S.name;
    $("dispMeta").textContent=findOriginLabel(S.origin)+" · "+S.gender+" · "+(S.ended?"완결":(S.phase+" "+S.turn+"/"+TARGET_TURNS));
    $("turnNo").textContent=S.turn;
    var html=WORLD.stats.map(function(s){
      var v=clamp(S.stats[s.key]!=null?S.stats[s.key]:s.init);
      return '<div class="bar-row"><div class="bar-label"><span>'+escapeHtml(s.label)+'</span><span>'+v+'</span></div>'+
        '<div class="bar-track"><div class="bar-fill" style="width:'+v+'%;background:linear-gradient(90deg,'+s.c1+','+s.c2+')"></div></div></div>';
    }).join("");
    $("bars").innerHTML=html;
    if(S.affName){ show($("affRow")); $("affName").textContent=S.affName; var a=clamp(S.aff); $("vAff").textContent=a; $("bAff").style.width=a+"%"; }
    else hide($("affRow"));
    var box=$("invItems"); box.innerHTML="";
    if(!S.inv.length){ box.innerHTML='<span class="chip empty">비어 있음</span>'; }
    else S.inv.forEach(function(it){ var s=document.createElement("span"); s.className="chip"; s.textContent=it; box.appendChild(s); });
  }
  function findOriginLabel(key){ for(var i=0;i<WORLD.origins.length;i++){ if(WORLD.origins[i].key===key) return WORLD.origins[i].label; } return key; }

  function renderScene(text){
    var sc=$("scene"); sc.innerHTML="";
    var node=document.createElement("div"); node.textContent=text; sc.appendChild(node);
    sc.scrollIntoView({behavior:"smooth", block:"start"});
  }
  function renderChoices(list){
    var c=$("choices"); c.innerHTML="";
    (list||[]).forEach(function(ch){
      var b=document.createElement("button"); b.className="choice"; b.textContent="❖ "+ch;
      b.addEventListener("click", function(){ takeAction(ch); }); c.appendChild(b);
    });
  }
  function renderEnding(kind){
    var t=$("scene"); var d=document.createElement("div");
    d.style.marginTop="18px"; d.style.paddingTop="14px"; d.style.borderTop="2px solid var(--accent)";
    d.style.textAlign="center"; d.style.color="var(--accent)";
    var head = kind==="사망" ? "終 — 이야기, 여기서 막을 내리다" : "完 — 한 편의 이야기가 끝나다";
    d.innerHTML='<div style="font-size:18px;letter-spacing:4px;margin-bottom:6px;">'+head+'</div><div style="font-size:12px;color:var(--muted);">제'+S.turn+'막까지의 여정이 마무리되었습니다.</div>';
    var btn=document.createElement("button"); btn.className="btn-start"; btn.style.marginTop="14px"; btn.textContent="새 이야기 고르기";
    btn.addEventListener("click", function(){ clearSave(); enterSelect(); });
    d.appendChild(btn); t.appendChild(d);
    $("freeInput").disabled=true; $("btnSend").disabled=true;
    $("freeInput").placeholder="이야기가 완결되었습니다.";
  }
  function renderToast(effects){
    var t=$("toast"); t.innerHTML="";
    if(!effects) return;
    var map={}; WORLD.stats.forEach(function(s){ map[s.key]=s.label; }); map.aff=WORLD.affLabel||"연심";
    var msgs=[];
    WORLD.stats.forEach(function(s){ var d=effects[s.key]; if(typeof d==="number" && d!==0) msgs.push(s.label+" "+(d>0?"+":"")+d); });
    if(typeof effects.aff==="number" && effects.aff!==0) msgs.push(map.aff+" "+(effects.aff>0?"+":"")+effects.aff);
    (effects.add_items||[]).forEach(function(i){ msgs.push("획득: "+i); });
    (effects.remove_items||[]).forEach(function(i){ msgs.push("잃음: "+i); });
    msgs.forEach(function(m){ var s=document.createElement("span"); s.textContent=m; t.appendChild(s); });
  }

  function busy(on){
    $("loading").classList.toggle("hidden", !on);
    if(S.ended){ $("btnSend").disabled=true; $("freeInput").disabled=true; }
    else { $("btnSend").disabled=on; $("freeInput").disabled=on; }
    $("choices").querySelectorAll(".choice").forEach(function(b){b.disabled=on;});
  }

  // ---------- prompt ----------
  function stateSummary(){
    var line=WORLD.stats.map(function(s){ return s.label+" "+(S.stats[s.key]!=null?S.stats[s.key]:s.init); }).join(", ");
    return "주인공: "+S.name+" ("+S.gender+", "+findOriginLabel(S.origin)+")\n"+
      "능력치 — "+line+"\n"+
      (S.affName? (WORLD.affLabel+" 상대: "+S.affName+" ("+S.aff+"/100)\n") : "")+
      "소지품: "+(S.inv.length? S.inv.join(", ") : "없음")+"\n현재 막: 제"+S.turn+"막";
  }
  function pacingHint(){
    var t=S.turn, T=TARGET_TURNS;
    if(t<=Math.round(T*0.18)) return "발단 단계입니다. 세계와 인물을 소개하고 주인공의 동기와 첫 사건을 제시하세요. 서두르지 말고 분위기를 쌓으세요.";
    if(t<=Math.round(T*0.5))  return "전개 단계입니다. 갈등을 키우고 관계를 진전시키며 복선을 심으세요.";
    if(t<=Math.round(T*0.72)) return "위기 단계입니다. 중대한 시련·배신·어려운 선택을 던지고 긴장을 끌어올리세요. 복선을 회수하기 시작하세요.";
    if(t<=Math.round(T*0.9))  return "절정 단계입니다. 최대의 대결과 감정의 정점으로 모든 갈등을 한 점에 모으세요. 곧 결말로 향하세요.";
    if(t<T+4) return "결말 단계입니다. 남은 실타래를 모두 수렴시켜 이번 1~3턴 안에 만족스럽게 완결(ending:true)하세요. 주된 갈등과 관계를 함께 매듭짓고 에필로그를 주세요.";
    return "[강제 마무리] 이야기가 충분히 길어졌습니다. 이번 턴에 반드시 ending:true로 완결하고 충실한 에필로그를 작성하세요.";
  }
  function rules(){
    var keyGuide=WORLD.stats.map(function(s){ return s.label+"="+s.key; }).join(", ");
    var romanceLine = WORLD.romance
      ? "3) "+WORLD.affLabel+" 상대(주요 조연)를 초중반에 등장시켜 단계적으로 관계를 진전시키고 결말에서 매듭지으세요. 처음 등장 시 effects.romance_name에 그 이름을 넣고, 이후 관계 변화는 effects.aff(-15~+15)로 표현하세요. "
      : "3) 매력적인 주요 조연들을 등장시켜 관계와 갈등을 엮으세요. ";
    var hpLabel = (function(){ for(var i=0;i<WORLD.stats.length;i++){ if(WORLD.stats[i].hp) return WORLD.stats[i].label; } return "체력"; })();
    return "당신은 한국어 "+WORLD.genre+" 인터랙티브 웹소설의 게임마스터이자, 한 편의 완결된 중편소설을 설계하는 작가입니다. "+WORLD.genre_desc+"\n"+
      "■ 작품 구조: 이 이야기는 약 "+TARGET_TURNS+"턴 안팎으로 완결되는 한 편의 작품입니다. 발단→전개→위기→절정→결말의 5단 구성을 따르세요. 매 턴 주어지는 '현재 단계/진행도'에 맞춰 밀도와 긴장을 조절하고, 후반엔 흩어진 실타래(주적·관계·비밀·목표 등)를 하나의 결말로 수렴시켜 목표 턴 부근에서 반드시 만족스럽게 마무리하세요.\n"+
      "■ 서술: 1) 매 턴 한국어 5~8문장(한 단락)으로 생생히 묘사하세요. 장르의 정취를 살리되 과하지 않게. 2) 행동 결과를 능력치 변화(보통 -15~+15)로 effects에 반영하고, 이유 없는 변화는 금지합니다. "+romanceLine+"4) 항상 2~4개의 선택지를 제시하세요(플레이어의 자유 입력도 가능), 단 결말 후엔 빈 배열. 5) 위험/전투 시 "+hpLabel+"을 감소시키고, 0이 되면 사망(나쁜 결말) 처리하세요. 과도하게 선정적인 묘사는 피하고 분위기 위주로. 6) 매 턴 memory에 핵심 연대기를 600자 이내로 갱신(인물·관계·사건·목표·복선·단서·세계관·감정 변화 보존). 7) phase에 현재 단계(발단/전개/위기/절정/결말)를 넣고, 완전히 끝나면 ending:true와 충실한 에필로그.\n"+
      "■ effects 키 안내(모든 수치는 변화량 델타, 없으면 0 또는 생략): "+keyGuide+(WORLD.romance? ", "+WORLD.affLabel+"=aff":"")+". add_items/remove_items로 소지품을 변경하세요.";
  }

  function buildPrompt(action){
    var hist = S.history.slice(-4).map(function(h){ return (h.role==="you"?"[플레이어 행동] ":"[장면] ")+h.text; }).join("\n\n");
    var p = rules() + "\n\n=== 현재 상태 ===\n"+stateSummary()+
      "\n진행도: "+S.turn+"/"+TARGET_TURNS+"턴. 페이싱 지시: "+pacingHint()+
      "\n\n=== 지금까지의 연대기 (장기 기억) ===\n"+(S.memory||"(아직 없음 — 이야기의 시작)")+
      "\n\n=== 바로 직전 전개 ===\n"+(hist||"(없음)")+"\n\n";
    if(action===null){
      p += "=== 지시 ===\n게임의 첫 장면(발단)을 시작하세요. 주인공의 출신("+findOriginLabel(S.origin)+")에 어울리는 도입부 사건과 함께, 약 "+TARGET_TURNS+"턴 뒤 완결될 한 편의 이야기로서 핵심 갈등의 씨앗과 모험으로 나아가는 계기를 심으세요.";
    } else {
      p += "=== 플레이어의 이번 행동 ===\n\""+action+"\"\n\n이 행동의 결과로 이야기를 이어가세요. 능력치/소지품 변화를 effects에 반영하세요.";
    }
    return p;
  }

  // ---------- Gemini API ----------
  function buildSchema(){
    var props={};
    WORLD.stats.forEach(function(s){ props[s.key]={type:"INTEGER"}; });
    props.aff={type:"INTEGER"};
    props.add_items={type:"ARRAY", items:{type:"STRING"}};
    props.remove_items={type:"ARRAY", items:{type:"STRING"}};
    props.romance_name={type:"STRING"};
    return {
      type:"OBJECT",
      properties:{
        scene:{type:"STRING"},
        choices:{type:"ARRAY", items:{type:"STRING"}},
        effects:{type:"OBJECT", properties:props},
        memory:{type:"STRING"}, phase:{type:"STRING"}, ending:{type:"BOOLEAN"}
      },
      required:["scene","choices","effects","memory","phase","ending"]
    };
  }
  var SAFETY = ["HARM_CATEGORY_HARASSMENT","HARM_CATEGORY_HATE_SPEECH","HARM_CATEGORY_SEXUALLY_EXPLICIT","HARM_CATEGORY_DANGEROUS_CONTENT"]
    .map(function(c){ return {category:c, threshold:"BLOCK_ONLY_HIGH"}; });

  async function geminiGenerate(prompt){
    var url = "https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(CFG.model)+":generateContent?key="+encodeURIComponent(CFG.key);
    var body = {
      contents:[{ role:"user", parts:[{text:prompt}] }],
      generationConfig:{ temperature:1.0, topP:0.95, maxOutputTokens:2048, responseMimeType:"application/json", responseSchema:buildSchema() },
      safetySettings:SAFETY
    };
    var res = await fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
    if(!res.ok){
      var t=""; try{ t=await res.text(); }catch(e){}
      if(res.status===400 && /API key not valid|API_KEY_INVALID/i.test(t)) throw new Error("API 키가 올바르지 않아요. ⚙에서 키를 다시 확인해 주세요.");
      if(res.status===404) throw new Error("모델 이름('"+CFG.model+"')을 찾을 수 없어요. ⚙에서 모델을 바꿔 주세요.");
      if(res.status===429) throw new Error("무료 사용 한도(분당/일일)를 넘었어요. 잠시 후 다시 시도하거나 모델을 Flash로 바꿔 주세요.");
      throw new Error("요청 실패("+res.status+"). "+t.slice(0,160));
    }
    var data = await res.json();
    var cand = data && data.candidates && data.candidates[0];
    if(!cand){ throw new Error("응답이 비어 있어요. 잠시 후 다시 시도해 주세요."); }
    if(cand.finishReason==="SAFETY"){ throw new Error("이 전개가 안전 필터에 걸렸어요. 다른 행동으로 시도해 주세요."); }
    var parts = cand.content && cand.content.parts || [];
    var txt = parts.map(function(p){return p.text||"";}).join("");
    return txt;
  }

  function parseJSON(raw){
    var t=(raw||"").trim();
    t=t.replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
    var i=t.indexOf("{"), j=t.lastIndexOf("}");
    if(i>=0 && j>i) t=t.slice(i,j+1);
    return JSON.parse(t);
  }

  async function callAI(action, attempt){
    attempt=attempt||0;
    try{ return parseJSON(await geminiGenerate(buildPrompt(action))); }
    catch(err){
      if(attempt<1 && /JSON|Unexpected|비어/i.test(err.message)) return callAI(action, attempt+1);
      throw err;
    }
  }

  function applyEffects(e){
    if(!e) return;
    WORLD.stats.forEach(function(s){ if(typeof e[s.key]==="number") S.stats[s.key]=clamp((S.stats[s.key]||0)+e[s.key]); });
    if(e.romance_name && !S.affName) S.affName=String(e.romance_name);
    if(typeof e.aff==="number" && S.affName) S.aff=clamp(S.aff+e.aff);
    (e.add_items||[]).forEach(function(i){ i=String(i); if(i && S.inv.indexOf(i)<0) S.inv.push(i); });
    (e.remove_items||[]).forEach(function(i){ i=String(i); var k=S.inv.indexOf(i); if(k>=0) S.inv.splice(k,1); });
  }
  function hpDead(){ for(var i=0;i<WORLD.stats.length;i++){ if(WORLD.stats[i].hp) return (S.stats[WORLD.stats[i].key]||0)<=0; } return false; }
  function showErr(msg){ var e=$("gameErr"); e.textContent=msg; show(e); }

  async function startStory(){
    hide($("gameErr")); busy(true); renderScene("이야기의 막이 오릅니다…");
    try{
      var data=await callAI(null);
      if(typeof data.memory==="string" && data.memory.trim()) S.memory=data.memory.trim();
      if(typeof data.phase==="string" && data.phase.trim()) S.phase=data.phase.trim();
      S.history.push({role:"scene", text:data.scene||""});
      applyEffects(data.effects);
      S.lastScene=data.scene||""; S.lastChoices=data.choices||[];
      renderScene(data.scene||"(장면을 불러오지 못했습니다)"); renderToast(data.effects);
      renderChoices(data.choices); renderStats(); saveGame();
    }catch(e){ showErr("이야기를 시작하지 못했습니다. "+e.message); }
    finally{ busy(false); }
  }

  async function takeAction(action){
    action=(action||"").trim(); if(!action || S.ended) return;
    hide($("gameErr")); busy(true);
    S.history.push({role:"you", text:action});
    var sc=$("scene"); var you=document.createElement("div"); you.className="you"; you.textContent="▶ "+action; sc.appendChild(you);
    $("toast").innerHTML="";
    try{
      var data=await callAI(action);
      applyEffects(data.effects);
      if(typeof data.memory==="string" && data.memory.trim()) S.memory=data.memory.trim();
      if(typeof data.phase==="string" && data.phase.trim()) S.phase=data.phase.trim();
      S.turn+=1;
      S.history.push({role:"scene", text:data.scene||""});
      S.lastScene=data.scene||""; S.lastChoices=(data.ending?[]:(data.choices||[]));
      renderScene(data.scene||"(장면을 불러오지 못했습니다)"); renderToast(data.effects);
      renderChoices(S.lastChoices);
      if(data.ending===true || hpDead()){ S.ended=true; renderChoices([]); renderEnding(hpDead()?"사망":"완결"); }
      renderStats(); saveGame();
    }catch(e){
      showErr("이야기를 이어가지 못했습니다. '행동'을 다시 눌러 재시도해 주세요. ("+e.message+")");
    }finally{ busy(false); }
  }

  function resumeGame(sv){
    WORLD=findWorld(sv.world); applyTheme(WORLD.theme);
    S.world=sv.world; S.name=sv.name; S.gender=sv.gender; S.origin=sv.origin;
    S.stats=sv.stats||{}; WORLD.stats.forEach(function(s){ if(S.stats[s.key]==null) S.stats[s.key]=s.init; });
    S.affName=sv.affName||""; S.aff=sv.aff||0; S.inv=sv.inv||[]; S.turn=sv.turn||1;
    S.phase=sv.phase||"발단"; S.ended=!!sv.ended;
    S.memory=sv.memory||""; S.history=sv.history||[];
    S.lastScene=sv.lastScene||""; S.lastChoices=sv.lastChoices||[];
    hide($("setup")); hide($("config")); hide($("select")); show($("game"));
    initGameChrome();
    renderStats(); renderScene(S.lastScene||"이야기를 이어갑니다…");
    renderChoices(S.ended?[]:S.lastChoices);
    if(S.ended) renderEnding("완결");
  }

  $("btnSend").addEventListener("click", function(){ var v=$("freeInput").value; $("freeInput").value=""; takeAction(v); });
  $("freeInput").addEventListener("keydown", function(e){ if(e.key==="Enter"){ var v=$("freeInput").value; $("freeInput").value=""; takeAction(v); } });

  // ---------- boot ----------
  loadCfg();
  applyTheme(DEFAULT_THEME);
  if(CFG.key){ hide($("config")); enterSelect(); }
  else { show($("config")); }

})();
</script>
</body>
